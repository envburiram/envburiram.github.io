# HawkScan: สแกนเฉพาะหน้า public ของเว็บแอป Apps Script (envbrclub) ด้วย GET อย่างเดียว
# ไม่มีคีย์ในไฟล์นี้ ห้ามใส่คีย์ลงไฟล์ (repo เป็นสาธารณะ)
# วิธีรัน: cd apps-script/envbrclub && API_KEY=$HAWK_API_KEY hawk scan stackhawk.yml
# deploymentId อยู่ใน includePaths และใน openapi.yaml ถ้าเปลี่ยน deployment ต้องแก้ทั้งสองที่
# ไฟล์ .yml/.yaml ไม่ถูก clasp push ขึ้น Apps Script
app:
  applicationId: ${APP_ID:9928696b-ff38-4fa2-8438-6bd6016c937d}
  env: ${APP_ENV:Production}
  host: ${APP_HOST:https://script.google.com}
  # openapi.yaml ประกาศ GET /exec ตัวเดียว HawkScan ขอหน้าตามค่าแรกของ enum page เท่านั้น
  # (สแกนวันที่ 2026-10-09 ครอบคลุมแค่ page=register) ถ้าจะสแกนหน้าอื่นให้ย้ายค่านั้นขึ้นเป็นค่าแรกของ enum แล้วสแกนใหม่
  openApiConf:
    filePath: openapi.yaml
  # จำกัดเฉพาะ /exec ของ deployment นี้ ไม่แตะส่วนอื่นของ script.google.com
  includePaths:
    - ".*/macros/s/AKfycbzOaotW-eCRj_l1NbG28z8DQ9FFqVrMTxRgk9DpFzx9cBQ2AgAnUoqiCx2f21J8z9PlKQ/exec.*"
  excludePaths:
    # google.script.run (ส่งใบสมัคร เข้าสู่ระบบ ฯลฯ) ห้ามแตะ
    - ".*/callback.*"
    # หน้าผู้ดูแล (เข้าสู่ระบบ) และหน้าบัตรสมาชิก
    - ".*[?&]page=(admin|card)([&#].*)?$"
hawk:
  spider:
    # ไม่ไล่ลิงก์เอง ใช้เฉพาะ URL จาก openapi.yaml
    base: false
    # ไม่ใช้ ajax spider เพราะจะรัน JS และกดปุ่มในหน้า ซึ่งอาจส่งฟอร์มจริง
    ajax: false
    maxDurationMinutes: 2
  scan:
    # ยิงช้า ๆ เพื่อไม่ให้กินโควตา Apps Script จนสมาชิกจริงใช้งานไม่ได้
    concurrentRequests: 2
    requestDelayMillis: 1000
    maxDurationMinutes: 30
tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: envburiram/envburiram.github.io
